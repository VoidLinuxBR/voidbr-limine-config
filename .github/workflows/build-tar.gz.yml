name: Criar release e arquivo .tar.gz

# Gatilhos para o workflow
on:
#  push:
#    branches:
#      - main

  workflow_dispatch: # Permite a execução manual do workflow
    inputs:
      debug_enabled: # Input para habilitar o modo de depuração
        type: boolean
        description: "With TMATE"
        required: false
        default: false

  #  schedule:  # Executa automaticamente toda sexta-feira às 05:00
  #    - cron: '0 5 * * 5'

  repository_dispatch: # Permite a execução através de eventos de webhook
    types:
      - webhook
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Obter a hora atual e o nome do repositório
        id: vars
        run: |
          echo "time=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          echo "repo_name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      # Gera fora da árvore para o tar não tentar incluir o próprio arquivo,
      # e deixa a pasta .git de fora.
      - name: Criar arquivo .tar.gz
        run: |
          tar --exclude=.git -czf "/tmp/${{ steps.vars.outputs.repo_name }}.tar.gz" .
          mv "/tmp/${{ steps.vars.outputs.repo_name }}.tar.gz" .

      - name: Salvar arquivo .tar.gz como artefato
        uses: actions/upload-artifact@v4
        with:
          name: arquivos
          path: ${{ steps.vars.outputs.repo_name }}.tar.gz

      - name: Criar release e enviar o .tar.gz
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.ORGANIZATION_TOKEN }}
          tag_name: ${{ steps.vars.outputs.time }}
          name: Release ${{ steps.vars.outputs.time }}
          body: |
            ## Descrição da Release

            - **Data e Hora:** ${{ steps.vars.outputs.time }}
            - **Nome do Repositório:** ${{ steps.vars.outputs.repo_name }}

            Descrição detalhada da release aqui.
            Inclua quaisquer mudanças, melhorias, ou correções de bugs que foram feitas.
          draft: false
          prerelease: false
          files: ${{ steps.vars.outputs.repo_name }}.tar.gz
          fail_on_unmatched_files: true
